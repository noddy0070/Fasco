<article
  class="collection-card group flex min-h-130 flex-col rounded-[28px] bg-white p-4 shadow-[0_14px_50px_rgba(0,0,0,0.06)]"
>
  <div class="flex items-start justify-between gap-3">
    <span
      class="collection-card-badge inline-flex rounded-full bg-[#E7DFD1] px-3 py-1 text-xs font-semibold uppercase tracking-[0.08em] text-[#1B1B1B]"
    >
      {{ product().badge }}
    </span>

    <button class="collection-card-heart grid size-10 place-items-center rounded-full bg-[#1A1A1A]/10 text-[#1A1A1A]">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 20.9999C11.355 20.4279 10.626 19.8329 9.85502 19.1999H9.84502C7.13002 16.9799 4.05302 14.4679 2.69402 11.4579C2.24754 10.4996 2.01093 9.45703 2.00001 8.3999C1.99703 6.94939 2.57879 5.55889 3.61383 4.54267C4.64887 3.52645 6.04981 2.9703 7.50002 2.9999C8.68065 3.00177 9.83586 3.34298 10.828 3.9829C11.264 4.26587 11.6584 4.60816 12 4.9999C12.3435 4.6097 12.7381 4.26761 13.173 3.9829C14.1648 3.34286 15.3197 3.00162 16.5 2.9999C17.9502 2.9703 19.3512 3.52645 20.3862 4.54267C21.4213 5.55889 22.003 6.94939 22 8.3999C21.9898 9.45872 21.7532 10.5031 21.306 11.4629C19.947 14.4729 16.871 16.9839 14.156 19.1999L14.146 19.2079C13.374 19.8369 12.646 20.4319 12.001 21.0079L12 20.9999Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <div class="collection-card-image-wrap mt-4 flex flex-1 items-center justify-center overflow-hidden rounded-3xl bg-[#FBFBF9] px-2 py-4">
    <img [src]="product().image" [alt]="product().name" class="collection-card-image h-full w-full max-h-62.5 object-contain" />
  </div>

  <div class="mt-4 flex flex-1 flex-col justify-end gap-2">
    <div>
      <p class="collection-card-title text-lg font-semibold uppercase tracking-[-0.03em] text-[#1A1A1A]">{{ product().name }}</p>
      <p class="mt-1 text-base text-[#4F4F4F]">{{ product().variant }}</p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      @for (swatch of product().swatches; track swatch) {
        <span class="size-5 rounded-full border border-[#A7A7A7]" [style.background-color]="swatch"></span>
      }
      <span class="ml-1 text-sm font-semibold text-[#1A1A1A]">{{ product().moreColors }}</span>
      <span class="ml-auto text-lg font-semibold text-[#1A1A1A]">{{ product().price }}</span>
    </div>

    <div class="collection-card-sizes">
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[#7A7A7A]">Available sizes</p>
      <div class="mt-2 grid grid-cols-6 gap-2">
        @for (size of product().sizes; track size) {
          <span class="size-pill">{{ size }}</span>
        }
      </div>
    </div>
  </div>
</article>
