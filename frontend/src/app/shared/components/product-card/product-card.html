<article
  class="collection-card group flex min-h-130 flex-col rounded-[28px] bg-white p-4 shadow-[0_14px_50px_rgba(0,0,0,0.06)]"
>
  <div class="flex items-start justify-between gap-3">
    <span
      class="collection-card-badge inline-flex rounded-full bg-[#E7DFD1] px-3 py-1 text-xs font-semibold uppercase tracking-[0.08em] text-[#1B1B1B]"
    >
      {{ product().badge }}
    </span>

    <button
      class="collection-card-heart grid size-10 place-items-center rounded-full bg-[#1A1A1A]/10 text-[#1A1A1A]"
    >
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 20.9999C11.355 20.4279 10.626 19.8329 9.85502 19.1999H9.84502C7.13002 16.9799 4.05302 14.4679 2.69402 11.4579C2.24754 10.4996 2.01093 9.45703 2.00001 8.3999C1.99703 6.94939 2.57879 5.55889 3.61383 4.54267C4.64887 3.52645 6.04981 2.9703 7.50002 2.9999C8.68065 3.00177 9.83586 3.34298 10.828 3.9829C11.264 4.26587 11.6584 4.60816 12 4.9999C12.3435 4.6097 12.7381 4.26761 13.173 3.9829C14.1648 3.34286 15.3197 3.00162 16.5 2.9999C17.9502 2.9703 19.3512 3.52645 20.3862 4.54267C21.4213 5.55889 22.003 6.94939 22 8.3999C21.9898 9.45872 21.7532 10.5031 21.306 11.4629C19.947 14.4729 16.871 16.9839 14.156 19.1999L14.146 19.2079C13.374 19.8369 12.646 20.4319 12.001 21.0079L12 20.9999ZM7.50002 4.9999C6.56853 4.98825 5.6701 5.34475 5.00002 5.9919C4.35441 6.62607 3.99358 7.49495 3.99994 8.3999C4.01135 9.1704 4.18585 9.92976 4.51202 10.6279C5.15353 11.9266 6.01913 13.102 7.06902 14.0999C8.06002 15.0999 9.20002 16.0679 10.186 16.8819C10.459 17.1069 10.737 17.3339 11.015 17.5609L11.19 17.7039C11.457 17.9219 11.733 18.1479 12 18.3699L12.013 18.3579L12.019 18.3529H12.025L12.034 18.3459H12.039H12.044L12.062 18.3309L12.103 18.2979L12.11 18.2919L12.121 18.2839H12.127L12.136 18.2759L12.8 17.7309L12.974 17.5879C13.255 17.3589 13.533 17.1319 13.806 16.9069C14.792 16.0929 15.933 15.1259 16.924 14.1209C17.9741 13.1235 18.8397 11.9484 19.481 10.6499C19.8131 9.9457 19.9901 9.17841 20.0001 8.3999C20.0042 7.49774 19.6435 6.6322 19 5.9999C18.3312 5.34982 17.4326 4.99039 16.5 4.9999C15.3619 4.99023 14.274 5.46727 13.51 6.3109L12 8.0509L10.49 6.3109C9.72609 5.46727 8.6381 4.99023 7.50002 4.9999Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <div
    class="collection-card-image-wrap mt-4 flex flex-1 items-center justify-center overflow-hidden rounded-3xl bg-[#FBFBF9] px-2 py-4"
  >
    <img
      [src]="product().image"
      [alt]="product().name"
      class="collection-card-image h-full w-full max-h-62.5 object-contain"
    />
  </div>

  <div class="mt-4 flex flex-1 flex-col justify-end gap-2">
    <div>
      <p
        class="collection-card-title text-lg font-semibold uppercase tracking-[-0.03em] text-[#1A1A1A]"
      >
        {{ product().name }}
      </p>
      <p class="mt-1 text-base text-[#4F4F4F]">{{ product().variant }}</p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      @for (swatch of product().swatches; track swatch) {
        <span
          class="size-5 rounded-full border border-[#A7A7A7]"
          [style.background-color]="swatch"
        ></span>
      }
      <span class="ml-1 text-sm font-semibold text-[#1A1A1A]">{{
        product().moreColors
      }}</span>

      <span class="ml-auto text-lg font-semibold text-[#1A1A1A]">{{
        product().price
      }}</span>
    </div>

    <div class="collection-card-sizes">
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[#7A7A7A]">
        Available sizes
      </p>
      <div class="mt-2 grid grid-cols-6 gap-2">
        @for (size of product().sizes; track size) {
          <span class="size-pill">{{ size }}</span>
        }
      </div>
    </div>
  </div>
</article>
