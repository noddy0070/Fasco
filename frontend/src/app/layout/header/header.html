<header class="flex my-4 md:my-12  responsive-margin-x md:justify-between items-center">
    <button class="md:hidden mr-[2vw]">
          <img src="assets/icons/hamburger-menu.svg" alt="fasco-logo"  class="h-auto w-10 "/>   
    </button>
    <app-transition-link link="/">
        <img src="assets/images/fasco-logo.png" alt="fasco-logo"  class="h-auto w-18.75 md:w-20"/>   
    </app-transition-link>
    <div class="ml-auto flex gap-[.5vw] sm:gap-[1vw] md:gap-[2vw] lg:gap-[3vw] items-center whitespace-nowrap  font-poppins">
        <nav class="gap-[1vw] md:gap-[2vw] lg:gap-[3vw] items-center hidden md:flex">
            @for (navItem of navLinks(); track $index) {
                <app-transition-link [link]="navItem.url">
                    {{navItem.name}}
                </app-transition-link>
            }
        </nav>
        <div class="w-auto md:w-auto lg:w-[20vw] flex gap-2 md:gap-5 border-[#E3E3E3] border rounded-full h-min py-2 px-2 lg:px-4">
            <input type="text" placeholder="Search" class="w-full font-medium  outline-none text-[14px] hidden md:hidden lg:block md:text-[16px] "/>
            <img src="assets/icons/search.svg" alt="search-icon" class="ml-auto  w-5 md:w-6 lg:w-7.5"/>
        </div>
        <app-transition-link link="/signup" class="w-min">
            <app-black-button placeholder="Sign Up" buttonClass="px-5 text-[12px]  md:px-8 lg:px-10 py-3 "></app-black-button>

        </app-transition-link>
       
    </div>

</header>
