<header class="flex my-4 md:my-12  responsive-margin-x md:justify-between items-center">
    
    <app-transition-link link="/" class="">
        <h1 class="text-[#484848] text-28px-sm md:text-28px-lg font-volkhov leading-[100%]">FASCO</h1>
    </app-transition-link>
    <div class="ml-auto flex gap-[2vw] md:gap-[2vw] lg:gap-[3vw] items-center whitespace-nowrap  font-poppins">
        <nav class="gap-[1vw] md:gap-[2vw] lg:gap-[3vw] items-center hidden md:flex">
            @for (navItem of navLinks(); track $index) {
                <app-transition-link class="relative hover-underline" [link]="navItem.url">
                    {{navItem.name}}
                </app-transition-link>
            }
        </nav>
        <div class="relative w-auto md:w-auto lg:w-[20vw]">
            <div class="flex gap-2 md:gap-5 border-[#E3E3E3] border rounded-full h-min py-2 px-2 lg:px-4">
                <input
                    type="text"
                    placeholder="Search"
                    class="w-full font-medium outline-none text-[14px] hidden md:hidden lg:block md:text-[16px]"
                    [ngModel]="searchQuery()"
                    (ngModelChange)="onSearchInput($event)"
                    (keydown.enter)="onSearchSubmit()"
                    (blur)="closeDropdown()"
                />
                <button type="button" (click)="onSearchSubmit()" class="ml-auto flex items-center">
                    <img src="assets/icons/search.svg" alt="search-icon" class="w-5 md:w-6 lg:w-7.5"/>
                </button>
            </div>
            @if (isDropdownOpen()) {
                <div class="search-dropdown absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-[0_16px_60px_rgba(0,0,0,0.14)] border border-[#E3E3E3] z-50 overflow-hidden">
                    @for (product of suggestions(); track product.name) {
                        <button
                            type="button"
                            class="search-suggestion-item w-full flex items-center gap-3 px-4 py-3 hover:bg-[#F5F1E8] transition-colors text-left"
                            (mousedown)="selectSuggestion(product)"
                        >
                            <img [src]="product.image" [alt]="product.name" class="w-12 h-12 object-contain rounded-xl bg-[#FBFBF9] p-1 shrink-0"/>
                            <div class="min-w-0 flex-1">
                                <p class="text-sm font-semibold text-[#1A1A1A] truncate">{{ product.name }}</p>
                                <p class="text-xs text-[#4F4F4F] truncate">{{ product.variant }}</p>
                            </div>
                            <span class="text-sm font-semibold text-[#1A1A1A] shrink-0">{{ product.price }}</span>
                        </button>
                    }
                    <button
                        type="button"
                        class="w-full px-4 py-3 text-xs font-semibold uppercase tracking-widest text-[#55647A] bg-[#F7F5EF] hover:bg-[#EDE9DE] transition-colors text-center"
                        (mousedown)="onSearchSubmit()"
                    >
                        See all results for "{{ searchQuery() }}"
                    </button>
                </div>
            }
        </div>
        @if (store.user()) {
            <app-transition-link link="/profile" class="w-min">
                <app-black-button placeholder="Profile" buttonClass="px-5 text-[12px]  md:px-8 lg:px-10 py-2 md:py-3 "></app-black-button>
            </app-transition-link>
        } @else {
            <app-transition-link link="/login" class="w-min">
                <app-black-button placeholder="Login" buttonClass="px-5 text-[12px]  md:px-8 lg:px-10 py-2 md:py-3 "></app-black-button>
            </app-transition-link>
        }
        <button class="md:hidden text-white bg-black p-1 rounded-[10px] h-[36px] aspect-square">
            <svg width="24" height="24" class="h-max mx-auto w-auto " viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.375 12C21.375 12.2984 21.2565 12.5845 21.0455 12.7955C20.8345 13.0065 20.5484 13.125 20.25 13.125H3.75C3.45163 13.125 3.16548 13.0065 2.9545 12.7955C2.74353 12.5845 2.625 12.2984 2.625 12C2.625 11.7016 2.74353 11.4155 2.9545 11.2045C3.16548 10.9935 3.45163 10.875 3.75 10.875H20.25C20.5484 10.875 20.8345 10.9935 21.0455 11.2045C21.2565 11.4155 21.375 11.7016 21.375 12ZM3.75 7.125H20.25C20.5484 7.125 20.8345 7.00647 21.0455 6.7955C21.2565 6.58452 21.375 6.29837 21.375 6C21.375 5.70163 21.2565 5.41548 21.0455 5.2045C20.8345 4.99353 20.5484 4.875 20.25 4.875H3.75C3.45163 4.875 3.16548 4.99353 2.9545 5.2045C2.74353 5.41548 2.625 5.70163 2.625 6C2.625 6.29837 2.74353 6.58452 2.9545 6.7955C3.16548 7.00647 3.45163 7.125 3.75 7.125ZM20.25 16.875H3.75C3.45163 16.875 3.16548 16.9935 2.9545 17.2045C2.74353 17.4155 2.625 17.7016 2.625 18C2.625 18.2984 2.74353 18.5845 2.9545 18.7955C3.16548 19.0065 3.45163 19.125 3.75 19.125H20.25C20.5484 19.125 20.8345 19.0065 21.0455 18.7955C21.2565 18.5845 21.375 18.2984 21.375 18C21.375 17.7016 21.2565 17.4155 21.0455 17.2045C20.8345 16.9935 20.5484 16.875 20.25 16.875Z"/>
            </svg>
        </button>
    </div>

</header>
