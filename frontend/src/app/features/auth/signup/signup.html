<div class="relative">
     <!-- background image -->
      <!-- overlay -->
      <div class="absolute inset-0 bg-[url('/assets/images/auth/thumbnail.png')] bg-cover bg-center -z-[10]"></div>
      <div class="absolute inset-0 bg-black/50 -z-[10]"></div>


    <section class="  overflow-hidden h-dvh md:max-h-dvh flex md:flex-col justify-center bg-no-repeat bg-center bg-cover b " >
        <div class=" responsive-margin-x bg-white  font-poppins border-[#DBDBDB] md:border-none my-auto 
        border shadow-[0px_20px_21.7px_rgba(68,68,68,0.4)] md:shadow-[0px_20px_21.7px_rgba(68,68,68,0.04)] md:rounded-l-none rounded-l-2xl rounded-r-2xl md:rounded-r-[30px] w-full md:w-auto max-w-140 md:max-w-none   grid grid-cols-1 md:grid-cols-2">
            <img src="assets/images/auth/thumbnail.png" class="hidden md:block col-span-1 aspect-square md:aspect-auto h-full w-full  object-cover"/>
            <div class="col-span-1 flex flex-col responsive-margin-x   my-8   items-center ">
                    <div class="flex flex-col gap-[2vw]  w-full  max-w-125 my-auto">
                        <h1 class="text-[#484848] text-60px-sm md:text-60px-lg font-volkhov leading-[100%]">FASCO</h1>
                        <div class="flex flex-col gap-[2vw] md:gap-[1.5vw] text-30px-sm sm:text-28px-lg leading-[120%] max-w-125 i">
                            <h2 class="font-volkhov ">Sign In To FASCO</h2>
                            <div class="flex font-poppins gap-4  text-16px-sm md:text-16px-lg">
                                <button class="flex items-center gap-2 justify-center w-full border-[#484848] hover:bg-black text-black hover:text-white border py-2 px-8 rounded-lg transition-colors duration-300 ease-in-out">
                                    <img src="assets/images/auth/google.png" class="size-6 mr-2"/>
                                    <span>Sign In with Google</span>
                                </button>
                            
                            </div>
                            <div class="text-[#838383] font-poppins mx-auto mt-[1vw] xl:mt-[2vw] text-28px-sm md:text-28px-lg  font-bold">
                                <span>
                                    -
                                </span>
                                <span>
                                    OR                        
                                </span>
                                <span>
                                    -
                                </span>
                            </div>
                            <form class="flex flex-col gap-[2vw] md:gap-[1.5vw] ">
                                <input placeholder="Email" name="email" type="email" class="focus:outline-none text-black placeholder:text-[#9D9D9D] leading-[250%] w-full tracking-[8%]  text-16px-sm md:text-16px-lg border-b  border-[#DBDBDB] " />
                                <div class="relative w-full">
                                    <input
                                        [type]="showPassword ? 'text' : 'password'"
                                        placeholder="Password"
                                        name="password"
                                        class="focus:outline-none text-black placeholder:text-[#9D9D9D] leading-[250%] w-full tracking-[8%] text-16px-sm md:text-16px-lg border-b border-[#DBDBDB] pr-10"
                                    />

                                    <button
                                        type="button"
                                        (click)="togglePassword()"
                                        class="absolute right-0 top-1/2 -translate-y-1/2 text-sm text-[#5B86E5]"
                                    >
                                        {{ showPassword ? 'Hide' : 'Show' }}
                                    </button>
                                </div>
                                <app-black-button class="mx-auto w-[80%] xl:mt-[12px]" buttonClass="w-full py-[8px] xl:py-[10px] " placeholder="Sign In"/>
                                <button class=" mx-auto w-[80%] md:mt-[-4px] lg:mt-[-10px] py-[8px] xl:py-[10px] hover:bg-[#dbe5f9] text-16px-sm md:text-16px-lg border-[#5B86E5] text-[#5B86E5] border  rounded-lg transition-colors duration-300 ease-in-out">
                                    <span>Register Now</span>
                                </button>
                                <app-transition-link link="/forgot-password" class="relative ml-auto mr-[10%] mt-[-8px] lg:mt-[-16px] font-semibold tracking-[8%] text-16px-sm md:text-16px-lg text-[#5B86E5]
                                    w-min whitespace-nowrap hover-underline" style="--after-color:#5B86E5">
                                    Forgot Password?
                                </app-transition-link>
                            </form>
                        </div>
                    </div>
                    <app-transition-link link="/terms" class="relative mt-auto pt-[16px] ml-auto  w-min whitespace-nowrap  hover-underline">
                        <p class="text-16px-sm md:text-16px-lg">FASCO Terms & Conditions</p>
                    </app-transition-link>
            </div>
        </div>

    </section>
</div>
