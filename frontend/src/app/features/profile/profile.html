<section class="responsive-margin-x my-10 md:my-16 font-poppins">
  <div class="max-w-2xl mx-auto border border-[#E3E3E3] rounded-2xl p-6 md:p-8 shadow-sm">
    <h1 class="text-2xl md:text-3xl font-semibold mb-6">My Profile</h1>

    @if (store.user(); as user) {
      <div class="space-y-3 text-[15px] md:text-[16px]">
        <p><strong>First Name:</strong> {{ user.firstName }}</p>
        <p><strong>Last Name:</strong> {{ user.lastName || '-' }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Phone:</strong> {{ user.phone || '-' }}</p>
      </div>

      <button
        type="button"
        class="mt-8 bg-black text-white rounded-[10px] px-6 py-2 hover:bg-[#333333] transition-colors duration-300 cursor-pointer"
        (click)="logout()"
      >
        Logout
      </button>
    } @else {
      <p class="text-gray-600">No user is logged in.</p>
    }
  </div>
</section>
