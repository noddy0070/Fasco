<div class="flex w-full min-w-0 max-w-full flex-col-reverse gap-5 md:flex-row ">
    <div class="flex shrink-0 pb-[2vw]">
        <!-- Arrows -->
        <div class="flex gap-4 mt-auto ">
            <button
                #carouselPrev
                type="button"
                class="rounded-full shadow-[0px_4px_14px_1px_rgba(0,0,0,0.16)] transition-all duration-300 hover:scale-105 ease-in-out text-[#B6B6B6] hover:text-black bg-white py-4 px-5"
            >
                <svg width="9" height="16" class="h-auto w-3" viewBox="0 0 9 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.90723 14.8999L0.899934 7.8999L7.90723 0.899902" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <button
                #carouselNext
                type="button"
                class="rotate-180 rounded-full shadow-[0px_4px_14px_1px_rgba(0,0,0,0.16)] transition-all duration-300 hover:scale-105 ease-in-out text-[#B6B6B6] hover:text-black bg-white py-4 px-5"
            >
                <svg width="9" height="16" class="h-auto w-3" viewBox="0 0 9 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.90723 14.8999L0.899934 7.8999L7.90723 0.899902" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- <button
                #carouselNext
                type="button"
                class="rounded-full shadow-[0px_4px_14px_1px_rgba(0,0,0,0.16)] transition-all duration-300 hover:scale-105 ease-in-out  bg-white py-4 px-5 text-[#B6B6B6] hover:text-black"
            >
                <svg width="9" height="16" class="h-auto w-3" image.pngviewBox="0 0 9 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0.900391 0.899902L7.90768 7.8999L0.900393 14.8999" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button> -->
        </div>
    
    </div>

    <div class="relative min-w-0 max-w-full flex-1">
        <div
            #swiperHost
            class="swiper limited-deal-swiper w-full min-w-0 max-w-full overflow-hidden pb-10"
        >
            <div class="swiper-wrapper">
                @for (image of images(); track image.src) {
                    <div class="swiper-slide">
                        <div class="limited-deal-slide-inner relative h-min">
                            <img
                                [src]="image.src"
                                alt=""
                                class="deal-img h-min aspect-3/4 object-cover"
                            />
                            <div
                                class="deal-overlay absolute flex flex-col gap-2 rounded-[18px] bg-white px-6 py-8 font-poppins leading-[120%] text-[#484848] text-16px-sm lg:text-16px-lg"
                            >
                                <div class="flex items-center gap-2">
                                    <p>{{ $index + 1 | leadingZero }}</p>
                                    <div class="w-7 border-t border-[#484848]"></div>
                                    <p>{{ image.name }}</p>
                                </div>
                                <p class="text-28px-sm lg:text-28px-lg">{{ image.discount }}</p>
                            </div>
                        </div>
                    </div>
                }
            </div>

            <div class="swiper-pagination limited-deal-pagination"></div>
        </div>
    </div>
</div>
